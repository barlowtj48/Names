{{ define "name_row" }}
<div
  class="name-row name-row--{{ .Status }}{{ if .Mine }} name-row--mine{{ end }}"
  id="name-{{ .ID }}"
  data-name="{{ .Text }}"
>
  <div class="name-text">
    {{ if .Rank }}<span class="rank" aria-label="Rank {{ .Rank }}">{{ .Rank }}</span>{{ end }}
    <button
      type="button"
      class="speak"
      title="Speak this name"
      aria-label="Speak {{ .Text }}"
      data-speak="{{ .Text }}"
    >
      🔊
    </button>
    <span class="name-label">{{ .Text }}</span>
    {{ if .Mine }}<span class="badge" title="You submitted this">yours</span>{{ end }}
    <time
      class="name-time"
      datetime="{{ .CreatedAt.UTC.Format "2006-01-02T15:04:05Z" }}"
      title="{{ .CreatedAt.UTC.Format "Jan 2, 2006 15:04 UTC" }}"
      data-rel
    >{{ .CreatedAt.Format "Jan 2, 2006" }}</time>
  </div>
  <div class="vote-controls">
    {{ if eq .Status "active" }}{{ if not .MyFlag }}
    <button
      type="button"
      class="flag"
      title="Flag as offensive"
      aria-label="Flag {{ .Text }} as offensive"
      hx-post="/api/names/{{ .ID }}/flag"
      hx-target="#name-{{ .ID }}"
      hx-swap="outerHTML"
      hx-confirm="Flag this name as offensive? After enough flags it disappears from the public list until a moderator reviews it."
      hx-include="#filter-form"
      hx-disabled-elt="this"
    >
      🚩
    </button>
    {{ end }}{{ end }}
    <button
      type="button"
      class="vote up{{ if eq .MyVote 1 }} active{{ end }}"
      aria-pressed="{{ if eq .MyVote 1 }}true{{ else }}false{{ end }}"
      aria-label="Upvote {{ .Text }}"
      hx-post="/api/names/{{ .ID }}/vote"
      hx-vals='{"value": {{ if eq .MyVote 1 }}0{{ else }}1{{ end }} }'
      hx-target="#name-{{ .ID }}"
      hx-swap="outerHTML"
      hx-include="#filter-form"
      hx-disabled-elt="this"
      hx-indicator="closest .name-row"
    >
      👍 <span class="count">{{ .Up }}</span>
    </button>
    <span
      class="score{{ if gt .Score 0 }} pos{{ else if lt .Score 0 }} neg{{ end }}"
      title="net score"
    >{{ if gt .Score 0 }}+{{ end }}{{ .Score }}</span>
    <button
      type="button"
      class="vote down{{ if eq .MyVote -1 }} active{{ end }}"
      aria-pressed="{{ if eq .MyVote -1 }}true{{ else }}false{{ end }}"
      aria-label="Downvote {{ .Text }}"
      hx-post="/api/names/{{ .ID }}/vote"
      hx-vals='{"value": {{ if eq .MyVote -1 }}0{{ else }}-1{{ end }} }'
      hx-target="#name-{{ .ID }}"
      hx-swap="outerHTML"
      hx-include="#filter-form"
      hx-disabled-elt="this"
      hx-indicator="closest .name-row"
    >
      👎 <span class="count">{{ .Down }}</span>
    </button>
  </div>
</div>
{{ end }}{{ template "name_row" .N }}
